name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# A newer push to the same PR or branch makes the running checks obsolete. Cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - uses: actions/checkout@v4

    - name: Format
      run: |
        rustup component add rustfmt
        cargo fmt --check --verbose

    - name: Build
      run: cargo build --verbose

    - name: Tests
      run: cargo test --verbose -- --show-output

    - name: Test encryption
      run: cargo test --features=encryption --verbose -- --show-output

    - name: Test blocking
      run: cargo test --features=blocking --verbose -- --show-output

    - name: Docs
      run: cargo doc --verbose

    - name: Example
      run: cargo run --example basic --verbose

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check typos
        uses: crate-ci/typos@master
